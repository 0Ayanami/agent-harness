name: agent-harness-cron
services:
  cron:
    build:
      context: ../..
      dockerfile: deployment/cron/Dockerfile
      args:
        PYTHON_BASE_IMAGE: ${CRON_PYTHON_IMAGE:-python:3.13-slim}
    environment:
      CRON_TIMEZONE: ${CRON_TIMEZONE:-Asia/Shanghai}
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - cron-state:/state
    read_only: true
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8081/health', timeout=2)"]
      interval: 3s
      timeout: 3s
      retries: 8
volumes:
  cron-state:
