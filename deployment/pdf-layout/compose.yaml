name: agent-harness-pdf-layout
services:
  pdf-layout:
    build:
      context: .
      args:
        PYTHON_BASE_IMAGE: ${PDF_LAYOUT_PYTHON_IMAGE:-python:3.13-slim}
    ports:
      - "127.0.0.1:8079:8079"
    restart: unless-stopped
    read_only: true
    mem_limit: 1g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8079/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 5
